<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VEIL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #09090b;
      }
      .stage {
        position: relative;
        width: 1200px;
        height: 630px;
        background:
          radial-gradient(ellipse 70% 64% at 62% 58%, #131316 0%, #09090b 68%);
        color: #f3f2ee;
        font-family: Outfit, system-ui, sans-serif;
      }
      .lockup {
        position: absolute;
        left: 72px;
        top: 198px;
        z-index: 4;
        width: 420px;
      }
      .wordmark {
        font-family: "Instrument Serif", serif;
        font-size: 96px;
        font-weight: 400;
        letter-spacing: 0.06em;
        line-height: 0.88;
        color: #f3f2ee;
      }
      .rule {
        width: 56px;
        height: 1px;
        background: #c9cdc8;
        margin: 22px 0 18px;
        opacity: 0.85;
      }
      .meta {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .caption {
        font-size: 13px;
        font-weight: 400;
        letter-spacing: 0.16em;
        color: #8b8b86;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 5px 10px 5px 8px;
        border-radius: 999px;
        border: 1px solid rgba(143, 175, 156, 0.5);
        color: #8faf9c;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      .pill i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #8faf9c;
        display: block;
      }
      .devices {
        position: absolute;
        left: 470px;
        top: 148px;
        width: 680px;
        height: 380px;
      }
      .frame {
        position: absolute;
        background: #131316;
        border: 1px solid rgba(201, 205, 200, 0.28);
        border-radius: 16px;
        padding: 12px 11px 16px;
      }
      .pip {
        position: absolute;
        top: 5px;
        left: 50%;
        width: 4px;
        height: 4px;
        margin-left: -2px;
        border-radius: 50%;
        background: #8b8b86;
        opacity: 0.45;
      }
      .screen {
        background: #09090b;
        border-radius: 9px;
        overflow: hidden;
        height: 100%;
        position: relative;
      }
      .frame-right {
        right: 28px;
        top: 8px;
        width: 392px;
        height: 252px;
        z-index: 1;
      }
      .frame-left {
        left: 18px;
        top: 78px;
        width: 418px;
        height: 268px;
        z-index: 2;
      }
      .glass {
        margin: 14px 14px 0;
        padding: 9px 12px;
        border-radius: 8px;
        background: rgba(243, 242, 238, 0.055);
        border: 1px solid rgba(201, 205, 200, 0.16);
        color: #8b8b86;
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 0.04em;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .glass .caret {
        width: 7px;
        height: 12px;
        border-radius: 1px;
        background: #8faf9c;
        opacity: 0.8;
      }
      .answer {
        padding: 16px 18px 18px;
        font-size: 14px;
        font-weight: 300;
        line-height: 1.55;
        color: #f3f2ee;
      }
      .answer p {
        margin: 0 0 7px;
      }
      .answer .dim {
        margin-top: 12px;
        color: #8b8b86;
        font-size: 11px;
        letter-spacing: 0.08em;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 7px;
        padding: 14px;
        height: 100%;
      }
      .tile {
        background: #131316;
        border: 1px solid rgba(201, 205, 200, 0.12);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mono {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1px solid rgba(201, 205, 200, 0.28);
        background: #09090b;
        color: #c9cdc8;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.08em;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .tile.empty .off {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 1px dashed rgba(201, 205, 200, 0.28);
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <header class="lockup">
        <div class="wordmark">VEIL</div>
        <div class="rule"></div>
        <div class="meta">
          <span class="caption">Visible only to you</span>
          <span class="pill"><i></i>Stealth on</span>
        </div>
      </header>
      <div class="devices">
        <div class="frame frame-right">
          <span class="pip"></span>
          <div class="screen">
            <div class="grid">
              <div class="tile"><span class="mono">AR</span></div>
              <div class="tile"><span class="mono">MK</span></div>
              <div class="tile"><span class="mono">JN</span></div>
              <div class="tile empty"><span class="off"></span></div>
            </div>
          </div>
        </div>
        <div class="frame frame-left">
          <span class="pip"></span>
          <div class="screen">
            <div class="glass"><span class="caret"></span>Ask anything</div>
            <div class="answer">
              <p>Lead with the number.</p>
              <p>Then the risk, then the ask.</p>
              <p class="dim">Visible on this screen only</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
